[project]
name = "cbj"
version = "0.1.0"
description = "CBJ creative tool: level model, rule-exact solver, and creative pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
cbj = "cbj.cli:main"

[project.optional-dependencies]
voice = [
    "nvidia-riva-client>=2.27.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"
